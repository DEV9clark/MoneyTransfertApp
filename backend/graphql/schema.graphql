"A datetime string with format 'Y-m-d H:i:s', e.g. '2018-05-23 13:43:32'."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    users: [User!]! @all
    user(id: ID @eq): User @find
    
    clients: [Client!]! @all
    client(id: ID @eq): Client @find

    transactions: [Transaction!]! @all
    transaction(id: ID @eq): Transaction @find

    wallets: [Wallet!]! @all
}

type Mutation {
    updateClient(
        id: ID! @rules(apply: ["required", "exists:clients,id"])
        name: String @rules(apply: ["sometimes", "string", "max:255"])
        email: String @rules(apply: ["sometimes", "email", "max:255"])
        phone: String @rules(apply: ["sometimes", "string", "max:20"])
        address: String @rules(apply: ["sometimes", "string", "max:255"])
    ): Client @update @guard(with: ["web"])
    
    updateTransaction(
        id: ID! @rules(apply: ["required", "exists:transactions,id"])
        reference: String @rules(apply: ["sometimes", "string", "max:255"])
        status: String @rules(apply: ["sometimes", "string", "in:pending,completed,failed,cancelled"])
        type: String @rules(apply: ["sometimes", "string", "max:50"])
    ): Transaction @update @guard(with: ["web"])
}

type User {
    id: ID!
    name: String!
    email: String!
    created_at: DateTime!
    updated_at: DateTime!
    wallet: Wallet @hasOne
}

type Client {
    id: ID!
    uuid: String
    name: String!
    email: String
    phone: String!
    address: String
    country_id: ID
    created_at: DateTime!
    updated_at: DateTime!
    transactions: [Transaction!]! @hasMany
}

type Wallet {
    id: ID!
    uuid: String!
    balance: Float!
    currency: String!
    user: User @belongsTo
}

type Transaction {
    id: ID!
    uuid: String!
    amount: Float!
    currency: String!
    status: String!
    type: String!
    reference: String
    created_at: DateTime!
    sender_wallet: Wallet @belongsTo
    payout_wallet: Wallet @belongsTo
    client: Client @belongsTo
}
